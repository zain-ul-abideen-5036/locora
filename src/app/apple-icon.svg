<!--
  Home-screen icon for iOS.

  Larger canvas than the favicon, so the inner arc is kept: at 180px it reads as
  intended. No rounded corners here - iOS applies its own mask, and a shape that
  rounds its own corners ends up with a visible double bevel.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <rect width="180" height="180" fill="#17335c"/>
  <g transform="translate(90 90) scale(3.6) translate(-16 -16)">
    <path d="M27 16A11 11 0 1 0 22.8 24.6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M21.5 16A5.5 5.5 0 1 0 18.4 20.9" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.55"/>
    <circle cx="16" cy="16" r="2.75" fill="#ffffff"/>
  </g>
</svg>
