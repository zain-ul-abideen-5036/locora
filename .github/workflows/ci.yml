name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run in progress. Without this, a
# branch pushed to three times in a minute keeps three full runs alive and the
# useful one queues behind the stale ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never a real value. Every job that needs a signing key gets this one, and it
  # is only ever used against a throwaway database.
  AUTH_SECRET: ci-signing-key-not-used-outside-continuous-integration
  EMAIL_BACKEND: console

jobs:
  # Static checks need no database and no browser, so they run first and fail
  # fast — there is no point spinning up Postgres to discover a type error.
  static:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The recording script is generated from the walkthrough, so this fails
      # when the two have drifted — which is the only moment anybody would
      # notice, since a stale narration document reads perfectly well.
      - name: Narration script is current
        run: npm run narration:check

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matched to the production major version. Testing against a different
        # one is how a behaviour difference reaches production undetected.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: locora
          POSTGRES_PASSWORD: locora
          POSTGRES_DB: locora_test
        ports:
          - 5432:5432
        # Without the health check the suite starts before Postgres is accepting
        # connections and fails on the first query.
        options: >-
          --health-cmd "pg_isready -U locora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Integration tests
        run: npm run test:integration
        env:
          # Deliberately not DATABASE_URL: the suite truncates every table
          # before each test, and requiring a distinct variable is what makes it
          # impossible to point at anything real by accident.
          TEST_DATABASE_URL: postgres://locora:locora@localhost:5432/locora_test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: locora
          POSTGRES_PASSWORD: locora
          POSTGRES_DB: locora_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U locora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install the browser
        # Only Chromium. Both Playwright projects use it, and downloading
        # Firefox and WebKit as well would add minutes to every run for browsers
        # nothing launches.
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://locora:locora@localhost:5432/locora_e2e
          # A placeholder, not a credential. The suite runs a production build,
          # so the configuration check applies; photo upload is not exercised
          # because it needs a real store.
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_CIPLACEHOLDER_notarealtoken

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # `build:app`, not `build`. The full script runs migrations first, which
        # is right on a deploy and wrong here — CI has no database to migrate and
        # should be checking that the application compiles.
        run: npm run build:app
        env:
          # Enough for a build to complete. No database is reached: every page
          # that queries one is rendered per request.
          NEXT_PUBLIC_SITE_URL: https://locora.example
